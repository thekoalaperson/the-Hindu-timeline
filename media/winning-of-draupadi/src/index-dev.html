<!doctype html>
<meta charset="utf-8">
<title>dev — Winning of Draupadī</title>
<style>
  body{margin:0;background:#0d0906;color:#cfa96a;font:14px Georgia}
  canvas{display:block;width:100%;max-width:1920px}
  #bar{padding:8px}
  input[type=range]{width:70%}
</style>
<canvas id="cv" width="1920" height="1080"></canvas>
<div id="bar">
  <button id="play">▶</button>
  <input type="range" id="seek" min="0" max="135" step="0.05" value="0">
  <span id="tt">0.0</span>
</div>
<script src="core.js"></script>
<script src="paint.js"></script>
<script src="people.js"></script>
<script src="cast.js"></script>
<script src="world.js"></script>
<script src="timeline.js"></script>
<script src="scenes1.js"></script>
<script src="scenes2.js"></script>
<script src="scenes3.js"></script>
<script src="main.js"></script>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const seek = document.getElementById('seek'), tt = document.getElementById('tt');
seek.max = __film.duration;
const q = new URLSearchParams(location.search);
let T = parseFloat(q.get('t') || '0'), playing = false, last = 0;
function frame(ts) {
  if (playing) { T += (ts - last) / 1000; if (T > __film.duration) T = 0; }
  last = ts;
  seek.value = T; tt.textContent = T.toFixed(1);
  __film.draw(ctx, T, {});
  requestAnimationFrame(frame);
}
if (!q.get('render')) requestAnimationFrame(frame);
// headless renderer hook: draws frame i at fps and returns JPEG data
window.__renderFrame = (i, fps, q2) => {
  __film.draw(ctx, i / fps, {});
  return cv.toDataURL('image/jpeg', q2 || 0.93);
};
seek.oninput = () => { T = parseFloat(seek.value); };
document.getElementById('play').onclick = () => playing = !playing;
</script>
