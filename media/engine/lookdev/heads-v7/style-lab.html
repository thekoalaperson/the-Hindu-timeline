<!doctype html>
<html><head><meta charset="utf-8">
<title>Character Style Lab — Draupadī &amp; Arjuna</title>
<style>
  :root{
    color-scheme: light;
    --bg:#e9d2a0; --bg2:#d6b97f; --panel-bg:#f6ecd2; --panel-border:#c9a869;
    --ink:#2a1608; --ink-soft:#5a4020; --gold:#a5741f; --gold-l:#e8b64c;
    --input-bg:#fffdf6; --input-border:#c9a869;
    --btn-bg:#efe0b8; --btn-bg-hover:#f3e7c4; --btn-active-bg:#e8b64c; --btn-active-text:#2a1608;
    --code-bg:#2a1608; --code-text:#f0e3c2;
    --shadow:0 1px 3px rgba(42,22,8,0.25);
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#171208; --bg2:#0e0b06; --panel-bg:#221b10; --panel-border:#5c4520;
    --ink:#f0e3c2; --ink-soft:#cbb98a; --gold:#e8b64c; --gold-l:#ffe9a8;
    --input-bg:#2b2312; --input-border:#5c4520;
    --btn-bg:#332a16; --btn-bg-hover:#3d331c; --btn-active-bg:#e8b64c; --btn-active-text:#241505;
    --code-bg:#0e0b06; --code-text:#e8dcb8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#171208; --bg2:#0e0b06; --panel-bg:#221b10; --panel-border:#5c4520;
      --ink:#f0e3c2; --ink-soft:#cbb98a; --gold:#e8b64c; --gold-l:#ffe9a8;
      --input-bg:#2b2312; --input-border:#5c4520;
      --btn-bg:#332a16; --btn-bg-hover:#3d331c; --btn-active-bg:#e8b64c; --btn-active-text:#241505;
      --code-bg:#0e0b06; --code-text:#e8dcb8;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{min-height:100vh;font-family:Georgia,'Times New Roman',serif;}
  .app{display:flex;align-items:flex-start;gap:22px;padding:22px;flex-wrap:wrap;}
  .stage-col{flex:0 0 auto;max-width:100%;}
  #stage{width:1100px;height:750px;display:block;border-radius:10px;box-shadow:var(--shadow);border:1px solid var(--panel-border);max-width:100%;height:auto;}
  .panel{flex:1 1 360px;min-width:340px;max-width:430px;background:var(--panel-bg);border:1px solid var(--panel-border);
    border-radius:10px;padding:16px 18px 22px;box-shadow:var(--shadow);max-height:calc(100vh - 44px);overflow-y:auto;}
  h1{font-size:19px;margin:0 0 4px;color:var(--ink);letter-spacing:.02em;}
  .sub{font-size:12px;color:var(--ink-soft);margin:0 0 16px;font-style:italic;}
  .group{margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--panel-border);}
  .group:last-child{border-bottom:none;margin-bottom:0;}
  .grouplabel{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
    color:var(--gold);margin-bottom:8px;}
  .btnrow{display:flex;flex-wrap:wrap;gap:6px;}
  button.toggle, button.preset{
    font:inherit;font-size:12.5px;padding:6px 11px;border-radius:6px;border:1px solid var(--input-border);
    background:var(--btn-bg);color:var(--ink);cursor:pointer;transition:background .12s;
  }
  button.toggle:hover, button.preset:hover{background:var(--btn-bg-hover);}
  button.toggle.active{background:var(--btn-active-bg);color:var(--btn-active-text);border-color:var(--gold);font-weight:700;}
  .ctrl{margin-bottom:11px;}
  .ctrl label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink);margin-bottom:3px;gap:8px;}
  .ctrl .val{color:var(--gold);font-variant-numeric:tabular-nums;min-width:2.8em;text-align:right;font-weight:700;}
  input[type=range]{width:100%;accent-color:var(--gold);}
  .checks label{display:flex;align-items:center;gap:7px;font-size:12.5px;margin-bottom:8px;cursor:pointer;}
  .radiorow{display:flex;align-items:center;gap:10px;font-size:12.5px;flex-wrap:wrap;margin-top:2px;}
  .radiorow .rl{color:var(--ink-soft);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-right:2px;}
  .radiorow label{display:flex;align-items:center;gap:4px;cursor:pointer;}
  textarea{
    width:100%;font-family:'SF Mono',Consolas,Menlo,monospace;font-size:11px;background:var(--code-bg);color:var(--code-text);
    border:1px solid var(--input-border);border-radius:6px;padding:8px;resize:vertical;line-height:1.45;
  }
  #styleCode{cursor:text;}
  .row-btn{margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  button.action{font:inherit;font-size:12.5px;padding:7px 14px;border-radius:6px;border:1px solid var(--gold);
    background:var(--gold-l);color:#2a1608;cursor:pointer;font-weight:700;}
  button.action:hover{filter:brightness(1.05);}
  .statusmsg{font-size:11.5px;color:var(--ink-soft);}
  .statusmsg.ok{color:#2f7a3a;}
  .statusmsg.err{color:#a5341f;}
</style>
</head>
<body>
<div class="app">
  <div class="stage-col">
    <canvas id="stage" width="2200" height="1500"></canvas>
  </div>
  <div class="panel">
    <h1>Character Style Lab <span style="font-size:11px;background:#2f7a3a;color:#fff;padding:2px 8px;border-radius:999px;vertical-align:middle;letter-spacing:.05em">BUILD&nbsp;v7&nbsp;·&nbsp;APPEAL&nbsp;PASS</span></h1>
    <p class="sub">Draupadī &amp; Arjuna — tune the shared face / ribbon-line / cel-shadow engine, then send back a style code.</p>

    <div class="group">
      <div class="grouplabel">Character</div>
      <div class="btnrow" data-group="character">
        <button class="toggle active" data-val="draupadi">Draupadī</button>
        <button class="toggle" data-val="arjuna">Arjuna</button>
      </div>
    </div>

    <div class="group">
      <div class="grouplabel">View (head panel)</div>
      <div class="btnrow" data-group="view">
        <button class="toggle active" data-val="front">Front</button>
        <button class="toggle" data-val="tq">¾</button>
        <button class="toggle" data-val="profile">Profile</button>
      </div>
    </div>

    <div class="group">
      <div class="grouplabel">Expression</div>
      <div class="btnrow" data-group="expression">
        <button class="toggle active" data-val="serene">Serene</button>
        <button class="toggle" data-val="joy">Joy</button>
        <button class="toggle" data-val="grief">Grief</button>
        <button class="toggle" data-val="resolve">Resolve</button>
      </div>
    </div>

    <div class="group">
      <div class="grouplabel">Presets</div>
      <div class="btnrow">
        <button class="preset" data-preset="fusion">Fusion (default)</button>
        <button class="preset" data-preset="folk">Folk</button>
        <button class="preset" data-preset="ink">Ink</button>
      </div>
    </div>

    <div class="group">
      <div class="grouplabel">Parameters</div>
      <div class="ctrl"><label>Eye scale <span class="val" id="v_eyeScale">1.00</span></label>
        <input type="range" id="eyeScale" min="0.7" max="1.4" step="0.01"></div>
      <div class="ctrl"><label>Iris ratio (of eye width) <span class="val" id="v_irisRatio">0.42</span></label>
        <input type="range" id="irisRatio" min="0.30" max="0.60" step="0.01"></div>
      <div class="ctrl"><label>Sclera tint (warm → pure) <span class="val" id="v_scleraTint">0.15</span></label>
        <input type="range" id="scleraTint" min="0" max="1" step="0.01"></div>
      <div class="ctrl"><label>Kohl weight <span class="val" id="v_kohlWeight">1.00</span></label>
        <input type="range" id="kohlWeight" min="0.5" max="2.0" step="0.01"></div>
      <div class="ctrl"><label>Line weight (global) <span class="val" id="v_lineWeight">1.00</span></label>
        <input type="range" id="lineWeight" min="0.5" max="2.0" step="0.01"></div>
      <div class="ctrl"><label>Line taper (uniform → thick-thin) <span class="val" id="v_lineTaper">1.00</span></label>
        <input type="range" id="lineTaper" min="0" max="1" step="0.01"></div>
      <div class="ctrl"><label>Shadow coverage <span class="val" id="v_shadowCoverage">1.00</span></label>
        <input type="range" id="shadowCoverage" min="0" max="1" step="0.01"></div>
      <div class="ctrl"><label>Shadow softness <span class="val" id="v_shadowSoftness">0.00</span></label>
        <input type="range" id="shadowSoftness" min="0" max="1" step="0.01"></div>
      <div class="ctrl"><label>Head ratio (length/width) <span class="val" id="v_headRatio">1.00</span></label>
        <input type="range" id="headRatio" min="0.85" max="1.15" step="0.005"></div>
      <div class="ctrl"><label>Brow weight <span class="val" id="v_browWeight">1.00</span></label>
        <input type="range" id="browWeight" min="0.6" max="1.6" step="0.01"></div>
    </div>

    <div class="group checks">
      <div class="grouplabel">Extras</div>
      <label><input type="checkbox" id="blush"> Blush</label>
      <label><input type="checkbox" id="skinGradient"> Skin gradient (modelled; default off)</label>
      <div class="radiorow">
        <span class="rl">Motif density</span>
        <label><input type="radio" name="density" value="low"> Low</label>
        <label><input type="radio" name="density" value="med" checked> Med</label>
        <label><input type="radio" name="density" value="high"> High</label>
      </div>
    </div>

    <div class="group">
      <div class="grouplabel">Style code (live)</div>
      <textarea id="styleCode" rows="9" readonly></textarea>
      <div class="row-btn">
        <button class="action" id="copyBtn">Copy style code</button>
        <span class="statusmsg" id="copyStatus"></span>
      </div>
    </div>

    <div class="group">
      <div class="grouplabel">Load style code</div>
      <textarea id="loadCode" rows="6" placeholder="Paste a style code JSON here"></textarea>
      <div class="row-btn">
        <button class="action" id="applyBtn">Apply</button>
        <span class="statusmsg" id="loadStatus"></span>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
const TAU = Math.PI*2;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
ctx.scale(2,2); // supersample: logical 1100x750
const W=1100, H=750;

// ---------- palette (verbatim from source model sheet) ----------
const INK='#2a1608', INK2='#42260f', KOHL='#180c05';
const GOLD='#e8b64c', GOLD_D='#a5741f', GOLD_L='#ffe9a8';
const CRIM='#8c1f28', CRIM_D='#6b1119', CRIM_L='#a83a41';
const INDIGO='#2a3b6b', INDIGO_L='#43568c';
const IVORY='#f0e3c2', IVORY_D='#d8c69a';
const TEAL='#1f6f5c';
const MARI='#e08a1e', ROSE='#c85a4a';
const LIP='#8f2a24';
const D_SKIN='#8a5330', D_SHADE='#5c3115';
const A_SKIN='#c08652', A_SHADE='#87511f';

const DR={who:'draupadi',female:true,skin:D_SKIN,shade:D_SHADE,iris:'#251405',irisMid:'#3a2410',lip:LIP};
const AR={who:'arjuna',female:false,skin:A_SKIN,shade:A_SHADE,iris:'#2c1a09',irisMid:'#43301a',lip:'#7c2c22'};

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// =====================================================================
// PARAMS — the whole tunable style state. Rendering below is a pure
// function of (character, view, expression, PARAMS): no Math.random(),
// no Date.now(), no hidden state.
// =====================================================================
const DEFAULTS = {
  character:'draupadi', view:'front', expression:'serene',
  eyeScale:1.0, irisRatio:0.42, scleraTint:0.15, kohlWeight:1.0,
  lineWeight:1.0, lineTaper:1.0, shadowCoverage:1.0, shadowSoftness:0.0,
  headRatio:1.0, browWeight:1.0,
  blush:false, skinGradient:false, motifDensity:'med'
};
// Preset bundles approximate the studio's own bake-off entries (folk /
// ink / fusion NOTES.md) using this shared parametric engine.
const PRESETS = {
  fusion:{eyeScale:1.0,  irisRatio:0.42, scleraTint:0.15, kohlWeight:1.0,  lineWeight:1.0,  lineTaper:1.0, shadowCoverage:1.0,  shadowSoftness:0.0,  headRatio:1.0,  browWeight:1.0,  blush:false, skinGradient:false, motifDensity:'med'},
  folk:  {eyeScale:1.0,  irisRatio:0.40, scleraTint:0.05, kohlWeight:1.3,  lineWeight:0.85, lineTaper:0.5, shadowCoverage:0.45, shadowSoftness:0.05, headRatio:1.0,  browWeight:1.15, blush:true,  skinGradient:false, motifDensity:'high'},
  ink:   {eyeScale:1.05, irisRatio:0.42, scleraTint:0.35, kohlWeight:1.15, lineWeight:1.4,  lineTaper:1.0, shadowCoverage:1.0,  shadowSoftness:0.0,  headRatio:1.05, browWeight:1.2,  blush:false, skinGradient:false, motifDensity:'low'}
};
let PARAMS = Object.assign({}, DEFAULTS);

const DENSITY_MULT = {low:0.6, med:1.0, high:1.5};
function densCount(n){ return Math.max(1, Math.round(n*DENSITY_MULT[PARAMS.motifDensity])); }
function irisMult(){ return PARAMS.irisRatio/0.42; }
function hexToRgb(h){ h=h.replace('#',''); return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]; }
function mixHex(a,b,t){ const A=hexToRgb(a),B=hexToRgb(b); const r=Math.round(A[0]+(B[0]-A[0])*t), g=Math.round(A[1]+(B[1]-A[1])*t), bl=Math.round(A[2]+(B[2]-A[2])*t); return 'rgb('+r+','+g+','+bl+')'; }
function scleraColor(){ return mixHex('#f4e9d6','#ffffff',PARAMS.scleraTint); }
function lighten(hex,t){ const c=hexToRgb(hex); const r=Math.round(c[0]+(255-c[0])*t), g=Math.round(c[1]+(255-c[1])*t), b=Math.round(c[2]+(255-c[2])*t); return 'rgb('+r+','+g+','+b+')'; }
function skinFillStyle(C){
  if(!PARAMS.skinGradient) return C.skin;
  const g = ctx.createRadialGradient(-0.15,-0.35,0.04, 0,0,0.95);
  g.addColorStop(0, lighten(C.skin,0.30));
  g.addColorStop(0.55, C.skin);
  g.addColorStop(1, C.skin);
  return g;
}
// wraps a shadow-drawing block: opacity = shadowCoverage (0 none .. 1 heavy),
// edge softness = shadowSoftness (0 hard cel .. 1 blurred)
function shadowFill(fn){
  ctx.save();
  ctx.globalAlpha = Math.max(0,Math.min(1,PARAMS.shadowCoverage));
  if(PARAMS.shadowSoftness>0.01) ctx.filter = 'blur('+(PARAMS.shadowSoftness*0.022).toFixed(4)+'px)';
  fn();
  ctx.restore();
}
function drawBlush(view){
  if(!PARAMS.blush) return;
  function dab(cx,cy,r){
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,'rgba(196,90,80,0.34)');
    g.addColorStop(1,'rgba(196,90,80,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fill();
  }
  if(view==='front'){ dab(-0.235,0.19,0.09); dab(0.235,0.19,0.09); }
  else if(view==='tq'){ dab(-0.27,0.17,0.10); dab(0.195,0.15,0.065); }
  else { dab(-0.30,0.20,0.085); }
}

// ---------- ribbon ink engine (ported; width now driven by PARAMS) ----------
function cr(pts, samples){
  samples=samples||18; const P=pts,n=P.length,out=[];
  if(n<3){return P.map(p=>({x:p.x,y:p.y,w:p.w}));}
  for(let i=0;i<n-1;i++){
    const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||P[i+1];
    for(let s=0;s<samples;s++){
      const t=s/samples,t2=t*t,t3=t2*t;
      const x=0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3);
      const y=0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3);
      const w=p1.w+(p2.w-p1.w)*t;
      out.push({x,y,w});
    }
  }
  out.push({x:P[n-1].x,y:P[n-1].y,w:P[n-1].w});
  return out;
}
function ribbon(dense,color){
  color=color||INK; const N=dense.length; if(N<2)return;
  const L=[],R=[];
  for(let i=0;i<N;i++){
    const p=dense[i]; let dx,dy;
    if(i===0){dx=dense[1].x-p.x;dy=dense[1].y-p.y;}
    else if(i===N-1){dx=p.x-dense[N-2].x;dy=p.y-dense[N-2].y;}
    else{dx=dense[i+1].x-dense[i-1].x;dy=dense[i+1].y-dense[i-1].y;}
    const len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,hw=Math.max(p.w,0.0005)/2;
    L.push({x:p.x+nx*hw,y:p.y+ny*hw}); R.push({x:p.x-nx*hw,y:p.y-ny*hw});
  }
  ctx.beginPath();
  ctx.moveTo(L[0].x,L[0].y);
  for(let i=1;i<N;i++)ctx.lineTo(L[i].x,L[i].y);
  for(let i=N-1;i>=0;i--)ctx.lineTo(R[i].x,R[i].y);
  ctx.closePath(); ctx.fillStyle=color; ctx.fill();
  ctx.beginPath();ctx.arc(dense[0].x,dense[0].y,Math.max(dense[0].w,0.0005)/2,0,TAU);ctx.fillStyle=color;ctx.fill();
  ctx.beginPath();ctx.arc(dense[N-1].x,dense[N-1].y,Math.max(dense[N-1].w,0.0005)/2,0,TAU);ctx.fill();
}
// lineWeight = global multiplier on every ribbon width.
// lineTaper  = 0 collapses every point to the segment's mean width (uniform),
//              1 keeps the authored per-point width (strong thick-thin).
// mult       = an extra multiplier for a specific feature (kohl / brow).
function applyLineParams(pts,mult){
  const m=(mult||1)*PARAMS.lineWeight;
  if(pts.length<2) return pts.map(p=>({x:p.x,y:p.y,w:Math.max(p.w*m,0.0005)}));
  let sum=0; for(const p of pts) sum+=p.w;
  const mean=sum/pts.length, t=PARAMS.lineTaper;
  return pts.map(p=>({x:p.x,y:p.y,w:Math.max((mean+(p.w-mean)*t)*m,0.0005)}));
}
function ink(pts,color,samples,mult){ ribbon(cr(applyLineParams(pts,mult),samples),color); }
function crClosed(pts, samples){
  samples=samples||18; const P=pts,n=P.length,out=[];
  for(let i=0;i<n;i++){
    const p0=P[(i-1+n)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n];
    for(let s=0;s<samples;s++){
      const t=s/samples,t2=t*t,t3=t2*t;
      const x=0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3);
      const y=0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3);
      out.push({x,y});
    }
  }
  return out;
}
function blob(pts,color){const d=crClosed(pts,18);ctx.beginPath();ctx.moveTo(d[0].x,d[0].y);for(let i=1;i<d.length;i++)ctx.lineTo(d[i].x,d[i].y);ctx.closePath();ctx.fillStyle=color;ctx.fill();}
function pathClosed(pts){const d=crClosed(pts,18);ctx.beginPath();ctx.moveTo(d[0].x,d[0].y);for(let i=1;i<d.length;i++)ctx.lineTo(d[i].x,d[i].y);ctx.closePath();}

// ---------- primitives ----------
function petalFlower(cx,cy,r,petals,col,coreCol,rot=0,petalLen=1){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.fillStyle=col;
  for(let i=0;i<petals;i++){const a=i/petals*TAU;ctx.save();ctx.rotate(a);
    ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(r*0.42,-r*0.30*petalLen,0,-r*petalLen);ctx.quadraticCurveTo(-r*0.42,-r*0.30*petalLen,0,0);ctx.fill();ctx.restore();}
  if(coreCol){ctx.fillStyle=coreCol;ctx.beginPath();ctx.arc(0,0,r*0.28,0,TAU);ctx.fill();}
  ctx.restore();
}
function dot(cx,cy,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fill();}
function ring(cx,cy,r,lw,col){ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.stroke();}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

// ---------- textile motifs ----------
function buti(x,y,s,col,core){petalFlower(x,y,s,5,col,core,0,1);}
function dotDiamond(x,y,s,col,core){
  ctx.save();ctx.translate(x,y);ctx.fillStyle=col;
  ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*0.62,0);ctx.lineTo(0,s);ctx.lineTo(-s*0.62,0);ctx.closePath();ctx.fill();

  ctx.beginPath();ctx.moveTo(-0.26,-2.46);ctx.quadraticCurveTo(-0.48,-2.34,-0.60,-2.06);ctx.quadraticCurveTo(-0.66,-1.92,-0.66,-1.82);ctx.lineTo(-0.53,-1.80);ctx.quadraticCurveTo(-0.52,-2.0,-0.42,-2.20);ctx.quadraticCurveTo(-0.34,-2.38,-0.14,-2.52);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(0.26,-2.44);ctx.quadraticCurveTo(0.50,-2.42,0.56,-2.20);ctx.quadraticCurveTo(0.58,-2.08,0.50,-2.06);ctx.lineTo(0.34,-2.24);ctx.quadraticCurveTo(0.30,-2.34,0.26,-2.34);ctx.quadraticCurveTo(0.30,-2.42,0.26,-2.44);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(0.50,-2.10);ctx.quadraticCurveTo(0.42,-2.26,0.32,-2.30);ctx.lineTo(0.30,-2.38);ctx.quadraticCurveTo(0.44,-2.30,0.54,-2.14);ctx.closePath();ctx.fill();
  ctx.strokeStyle=GOLD;ctx.lineWidth=0.05;ctx.beginPath();ctx.moveTo(-0.46,-2.28);ctx.lineTo(-0.34,-2.34);ctx.stroke();ctx.beginPath();ctx.moveTo(0.46,-2.26);ctx.lineTo(0.34,-2.32);ctx.stroke();
  drawHand(-0.66,-1.78,0.13,1.3,'grip',C);
  drawHand(0.30,-2.34,0.12,-0.2,'draw',C);

  drawHead({cx:-0.02,cy:-2.86,S:0.53,view:'profile',who:'arjuna',expr});
  ctx.restore();
}

// =====================================================================
// STAGE
// =====================================================================
function drawStageBackground(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#f5e8c4');g.addColorStop(0.55,'#e9d2a0');g.addColorStop(1,'#d6b97f');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const rnd=mulberry32(11);
  for(let i=0;i<900;i++){const x=rnd()*W,y=rnd()*H,r=rnd()*1.3+0.2;ctx.fillStyle='rgba(90,60,25,'+(rnd()*0.05).toFixed(3)+')';ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}
  const vg=ctx.createRadialGradient(W/2,H/2,W*0.35,W/2,H/2,W*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(60,35,10,0.14)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  ctx.save();roundRect(24,24,660,702,14);ctx.strokeStyle='rgba(165,116,31,0.55)';ctx.lineWidth=2;ctx.stroke();
  roundRect(704,24,372,702,14);ctx.stroke();ctx.restore();
}

// head panel geometry
const HEAD_CX=354, HEAD_CY=370, HEAD_S=310;
// figure panel geometry
const FIG_CX=890, FIG_BASEY=673, FIG_SCALE=170;

function render(){
  ctx.save();
  ctx.clearRect(0,0,W,H);
  drawStageBackground();
  const expr = EXPR[PARAMS.expression] || NEUTRAL;
  drawHead({cx:HEAD_CX,cy:HEAD_CY,S:HEAD_S,view:PARAMS.view,who:PARAMS.character,expr});
  if(PARAMS.character==='draupadi'){
    drawDraupadiFull(FIG_CX,FIG_BASEY,FIG_SCALE,expr);
  } else {
    drawArjunaFull(FIG_CX,FIG_BASEY,FIG_SCALE,expr);
  }
  ctx.restore();
  updateStyleCode();
}

// =====================================================================
// UI WIRING
// =====================================================================
const SLIDER_IDS=['eyeScale','irisRatio','scleraTint','kohlWeight','lineWeight','lineTaper','shadowCoverage','shadowSoftness','headRatio','browWeight'];
function syncUIFromParams(){
  SLIDER_IDS.forEach(id=>{
    const el=document.getElementById(id);
    el.value = PARAMS[id];
    document.getElementById('v_'+id).textContent = Number(PARAMS[id]).toFixed(id==='headRatio'?3:2);
  });
  document.getElementById('blush').checked = !!PARAMS.blush;
  document.getElementById('skinGradient').checked = !!PARAMS.skinGradient;
  document.querySelectorAll('input[name="density"]').forEach(r=>{ r.checked = (r.value===PARAMS.motifDensity); });
  setActiveButton('character', PARAMS.character);
  setActiveButton('view', PARAMS.view);
  setActiveButton('expression', PARAMS.expression);
}
function setActiveButton(group,val){
  document.querySelectorAll('.btnrow[data-group="'+group+'"] button').forEach(b=>{
    b.classList.toggle('active', b.dataset.val===val);
  });
}
SLIDER_IDS.forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener('input',()=>{
    PARAMS[id]=parseFloat(el.value);
    document.getElementById('v_'+id).textContent = Number(PARAMS[id]).toFixed(id==='headRatio'?3:2);
    render();
  });
});
document.getElementById('blush').addEventListener('change',e=>{ PARAMS.blush=e.target.checked; render(); });
document.getElementById('skinGradient').addEventListener('change',e=>{ PARAMS.skinGradient=e.target.checked; render(); });
document.querySelectorAll('input[name="density"]').forEach(r=>{
  r.addEventListener('change',e=>{ if(e.target.checked){ PARAMS.motifDensity=e.target.value; render(); } });
});
document.querySelectorAll('.btnrow[data-group]').forEach(row=>{
  row.addEventListener('click', e=>{
    const btn=e.target.closest('button'); if(!btn) return;
    const group=row.dataset.group;
    PARAMS[group]=btn.dataset.val;
    setActiveButton(group, btn.dataset.val);
    render();
  });
});
document.querySelectorAll('button.preset').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const p=PRESETS[btn.dataset.preset];
    Object.assign(PARAMS,p);
    syncUIFromParams();
    render();
  });
});

function currentStyleObject(){
  const o={character:PARAMS.character,view:PARAMS.view,expression:PARAMS.expression};
  SLIDER_IDS.forEach(id=>{ o[id]=Math.round(PARAMS[id]*1000)/1000; });
  o.blush=PARAMS.blush; o.skinGradient=PARAMS.skinGradient; o.motifDensity=PARAMS.motifDensity;
  return o;
}
function updateStyleCode(){
  document.getElementById('styleCode').value = JSON.stringify(currentStyleObject());
}
document.getElementById('styleCode').addEventListener('click', function(){ this.select(); });
document.getElementById('copyBtn').addEventListener('click', ()=>{
  const el=document.getElementById('styleCode');
  const text=el.value;
  const statusEl=document.getElementById('copyStatus');
  function ok(msg){ statusEl.textContent=msg; statusEl.className='statusmsg ok'; setTimeout(()=>{statusEl.textContent='';statusEl.className='statusmsg';},2200); }
  function fallback(){
    el.focus(); el.select(); el.setSelectionRange(0,text.length);
    try{ const done=document.execCommand('copy'); ok(done? 'Copied (fallback).' : 'Selected — press Ctrl/Cmd+C.'); }
    catch(e){ ok('Selected — press Ctrl/Cmd+C.'); }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>ok('Copied to clipboard.')).catch(fallback);
  } else {
    fallback();
  }
});

function applyStyleCode(str){
  const statusEl=document.getElementById('loadStatus');
  let obj;
  try{ obj=JSON.parse(str); }
  catch(e){ statusEl.textContent='Invalid JSON.'; statusEl.className='statusmsg err'; return; }
  const RANGES={
    eyeScale:[0.7,1.4], irisRatio:[0.30,0.60], scleraTint:[0,1], kohlWeight:[0.5,2.0],
    lineWeight:[0.5,2.0], lineTaper:[0,1], shadowCoverage:[0,1], shadowSoftness:[0,1],
    headRatio:[0.85,1.15], browWeight:[0.6,1.6]
  };
  SLIDER_IDS.forEach(id=>{
    if(typeof obj[id]==='number' && isFinite(obj[id])){
      const [lo,hi]=RANGES[id];
      PARAMS[id]=Math.max(lo,Math.min(hi,obj[id]));
    }
  });
  if(obj.character==='draupadi'||obj.character==='arjuna') PARAMS.character=obj.character;
  if(obj.view==='front'||obj.view==='tq'||obj.view==='profile') PARAMS.view=obj.view;
  if(EXPR[obj.expression]) PARAMS.expression=obj.expression;
  if(typeof obj.blush==='boolean') PARAMS.blush=obj.blush;
  if(typeof obj.skinGradient==='boolean') PARAMS.skinGradient=obj.skinGradient;
  if(obj.motifDensity==='low'||obj.motifDensity==='med'||obj.motifDensity==='high') PARAMS.motifDensity=obj.motifDensity;
  syncUIFromParams();
  render();
  statusEl.textContent='Applied.'; statusEl.className='statusmsg ok';
  setTimeout(()=>{statusEl.textContent='';statusEl.className='statusmsg';},2200);
}
document.getElementById('applyBtn').addEventListener('click', ()=>{
  applyStyleCode(document.getElementById('loadCode').value.trim());
});

// ---------- init ----------
syncUIFromParams();
render();
window.__done = true;
</script>
