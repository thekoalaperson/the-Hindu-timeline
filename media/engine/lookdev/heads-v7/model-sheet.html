<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#111}
  #cv{width:1920px;height:1080px;display:block}
</style></head><body>
<canvas id="cv" width="3840" height="2160"></canvas>
<script>
'use strict';
const TAU = Math.PI*2;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.scale(2,2); // supersample: logical 1920x1080
const W=1920, H=1080;

// ---------- palette ----------
const INK='#2a1608', INK2='#42260f', KOHL='#180c05';
const GOLD='#e8b64c', GOLD_D='#a5741f', GOLD_L='#ffe9a8', GOLD_DD='#7c530f';
const PARCH='#e9d2a0', PARCH_L='#f5e8c4', PARCH_D='#d6b97f', PARCH_EDGE='#c9a869';
const CRIM='#8c1f28', CRIM_D='#6b1119', CRIM_L='#a83a41';
const INDIGO='#2a3b6b', INDIGO_D='#1a2749', INDIGO_L='#43568c';
const IVORY='#f0e3c2', IVORY_D='#d8c69a';
const TEAL='#1f6f5c', TEAL_D='#134438';
const MARI='#e08a1e', ROSE='#c85a4a';
const LIP='#8f2a24';
const WHT='#f6efdd';
const D_SKIN='#8a5330', D_SHADE='#5c3115';
const A_SKIN='#c08652', A_SHADE='#87511f';

// character configs
const DR={who:'draupadi',female:true,skin:D_SKIN,shade:D_SHADE,iris:'#251405',irisMid:'#3a2410',lip:LIP};
const AR={who:'arjuna',female:false,skin:A_SKIN,shade:A_SHADE,iris:'#2c1a09',irisMid:'#43301a',lip:'#7c2c22'};

// ---------- rng ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ---------- ribbon ink engine (ported from Comic Ink) ----------
function cr(pts, samples){
  samples=samples||18; const P=pts,n=P.length,out=[];
  if(n<3){return P.map(p=>({x:p.x,y:p.y,w:p.w}));}
  for(let i=0;i<n-1;i++){
    const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||P[i+1];
    for(let s=0;s<samples;s++){
      const t=s/samples,t2=t*t,t3=t2*t;
      const x=0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3);
      const y=0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3);
      const w=p1.w+(p2.w-p1.w)*t;
      out.push({x,y,w});
    }
  }
  out.push({x:P[n-1].x,y:P[n-1].y,w:P[n-1].w});
  return out;
}
function ribbon(dense,color){
  color=color||INK; const N=dense.length; if(N<2)return;
  const L=[],R=[];
  for(let i=0;i<N;i++){
    const p=dense[i]; let dx,dy;
    if(i===0){dx=dense[1].x-p.x;dy=dense[1].y-p.y;}
    else if(i===N-1){dx=p.x-dense[N-2].x;dy=p.y-dense[N-2].y;}
    else{dx=dense[i+1].x-dense[i-1].x;dy=dense[i+1].y-dense[i-1].y;}
    const len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,hw=Math.max(p.w,0.0005)/2;
    L.push({x:p.x+nx*hw,y:p.y+ny*hw}); R.push({x:p.x-nx*hw,y:p.y-ny*hw});
  }
  ctx.beginPath();
  ctx.moveTo(L[0].x,L[0].y);
  for(let i=1;i<N;i++)ctx.lineTo(L[i].x,L[i].y);
  for(let i=N-1;i>=0;i--)ctx.lineTo(R[i].x,R[i].y);
  ctx.closePath(); ctx.fillStyle=color; ctx.fill();
  ctx.beginPath();ctx.arc(dense[0].x,dense[0].y,Math.max(dense[0].w,0.0005)/2,0,TAU);ctx.fillStyle=color;ctx.fill();
  ctx.beginPath();ctx.arc(dense[N-1].x,dense[N-1].y,Math.max(dense[N-1].w,0.0005)/2,0,TAU);ctx.fill();
}
function ink(pts,color,samples){ribbon(cr(pts,samples),color);}
function crClosed(pts,samples){
  samples=samples||18; const P=pts,n=P.length,out=[];
  for(let i=0;i<n;i++){
    const p0=P[(i-1+n)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n];
    for(let s=0;s<samples;s++){
      const t=s/samples,t2=t*t,t3=t2*t;
      const x=0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3);
      const y=0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3);
      out.push({x,y});
    }
  }
  return out;
}
function blob(pts,color){const d=crClosed(pts,18);ctx.beginPath();ctx.moveTo(d[0].x,d[0].y);for(let i=1;i<d.length;i++)ctx.lineTo(d[i].x,d[i].y);ctx.closePath();ctx.fillStyle=color;ctx.fill();}
function pathClosed(pts){const d=crClosed(pts,18);ctx.beginPath();ctx.moveTo(d[0].x,d[0].y);for(let i=1;i<d.length;i++)ctx.lineTo(d[i].x,d[i].y);ctx.closePath();}

// ---------- primitives ----------
function petalFlower(cx,cy,r,petals,col,coreCol,rot=0,petalLen=1){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.fillStyle=col;
  for(let i=0;i<petals;i++){const a=i/petals*TAU;ctx.save();ctx.rotate(a);
    ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(r*0.42,-r*0.30*petalLen,0,-r*petalLen);ctx.quadraticCurveTo(-r*0.42,-r*0.30*petalLen,0,0);ctx.fill();ctx.restore();}
  if(coreCol){ctx.fillStyle=coreCol;ctx.beginPath();ctx.arc(0,0,r*0.28,0,TAU);ctx.fill();}
  ctx.restore();
}
function dot(cx,cy,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fill();}
function ring(cx,cy,r,lw,col){ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.stroke();}
function sawBorder(x,y,w,h,col,n){ctx.save();ctx.fillStyle=col;const step=w/n;ctx.beginPath();for(let i=0;i<n;i++){const px=x+i*step;ctx.moveTo(px,y+h);ctx.lineTo(px+step*0.5,y);ctx.lineTo(px+step,y+h);}ctx.closePath();ctx.fill();ctx.restore();}

// mandala sunburst halo
function mandala(cx,cy,R,rings){
  ctx.save();ctx.translate(cx,cy);
  for(const rg of rings){const {r,n,col,type,r2}=rg;
    if(type==='ray'){ctx.fillStyle=col;for(let i=0;i<n;i++){ctx.save();ctx.rotate(i/n*TAU);ctx.beginPath();ctx.moveTo(0,-r);ctx.quadraticCurveTo(r2*0.16,-(r+r2)*0.5,0,-r2);ctx.quadraticCurveTo(-r2*0.16,-(r+r2)*0.5,0,-r);ctx.fill();ctx.restore();}}
    else if(type==='dots'){ctx.fillStyle=col;for(let i=0;i<n;i++){const a=i/n*TAU;dot(Math.cos(a)*r,Math.sin(a)*r,r2,col);}}
    else if(type==='ring'){ring(0,0,r,r2,col);}
  }
  ctx.restore();
}
function archPath(cx,top,w,hgt){const hw=w/2;ctx.beginPath();ctx.moveTo(cx-hw,top+hgt);ctx.lineTo(cx-hw,top+hgt*0.42);ctx.quadraticCurveTo(cx-hw,top+hgt*0.10,cx-hw*0.42,top+hgt*0.03);ctx.quadraticCurveTo(cx,top-hgt*0.02,cx,top-hgt*0.02);ctx.quadraticCurveTo(cx+hw*0.42,top+hgt*0.03,cx+hw,top+hgt*0.42);ctx.lineTo(cx+hw,top+hgt);ctx.closePath();}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

// ---------- textile motifs (3 varied) ----------
function buti(x,y,s,col,core){petalFlower(x,y,s,5,col,core,0,1);}
function dotDiamond(x,y,s,col,core){ // motif 3: 4 dots around a diamond
  ctx.save();ctx.translate(x,y);ctx.fillStyle=col;
  ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*0.62,0);ctx.lineTo(0,s);ctx.lineTo(-s*0.62,0);ctx.closePath();ctx.fill();
  if(core){ctx.fillStyle=core;for(const a of [0,0.25,0.5,0.75]){dot(Math.cos(a*TAU)*s*1.35,Math.sin(a*TAU)*s*1.35,s*0.22,core);}}
  ctx.restore();
}
// stripe border already handled via strokes inline

// ---------- background ----------
function drawBackground(){
  const g=ctx.createRadialGradient(W/2,H*0.42,120,W/2,H*0.5,W*0.72);
  g.addColorStop(0,PARCH_L);g.addColorStop(0.55,PARCH);g.addColorStop(1,PARCH_D);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const rnd=mulberry32(7);
  for(let i=0;i<2600;i++){const x=rnd()*W,y=rnd()*H,r=rnd()*1.5+0.2;ctx.fillStyle='rgba(90,60,25,'+(rnd()*0.05).toFixed(3)+')';ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}
  for(let i=0;i<40;i++){const x=rnd()*W,y=rnd()*H,r=rnd()*40+20;ctx.fillStyle='rgba(150,110,50,'+(rnd()*0.03).toFixed(3)+')';ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}
  const vg=ctx.createRadialGradient(W/2,H/2,W*0.35,W/2,H/2,W*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(60,35,10,0.22)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}
function drawFrame(){
  const m=16;
  ctx.strokeStyle=CRIM_D;ctx.lineWidth=3;ctx.strokeRect(m,m,W-2*m,H-2*m);
  const bx=m+7,by=m+7,bw=W-2*(m+7),bh=H-2*(m+7),bandW=22;
  ctx.save();ctx.beginPath();ctx.rect(bx,by,bw,bh);ctx.rect(bx+bandW,by+bandW,bw-2*bandW,bh-2*bandW);ctx.fillStyle=INDIGO_D;ctx.fill('evenodd');ctx.restore();
  ctx.strokeStyle=GOLD;ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,bh);ctx.strokeRect(bx+bandW,by+bandW,bw-2*bandW,bh-2*bandW);
  const flor=(x,y)=>{petalFlower(x,y,7,6,GOLD,MARI,0,1);};
  for(let x=bx+bandW+28;x<bx+bw-bandW-18;x+=60){flor(x,by+bandW/2);flor(x,by+bh-bandW/2);}
  for(let y=by+bandW+28;y<by+bh-bandW-18;y+=60){flor(bx+bandW/2,y);flor(bx+bw-bandW/2,y);}
  const corner=(cx,cy)=>{dot(cx,cy,bandW*0.7,CRIM);ring(cx,cy,bandW*0.7,2,GOLD);petalFlower(cx,cy,bandW*0.5,8,GOLD,MARI);};
  corner(bx+bandW/2,by+bandW/2);corner(bx+bw-bandW/2,by+bandW/2);corner(bx+bandW/2,by+bh-bandW/2);corner(bx+bw-bandW/2,by+bh-bandW/2);
}

// =====================================================================
// FACE ENGINE — folk almond eyes + ribbon line + hard cel shadow
// all face fns run inside ctx.translate(cx,cy).scale(S,S); units ~ -0.95..1.0
// =====================================================================
function drawHead(o){
  const C = o.who==='draupadi'?DR:AR;
  ctx.save();ctx.translate(o.cx,o.cy);ctx.scale(o.S,o.S);ctx.lineJoin='round';ctx.lineCap='round';
  const ex=o.expr||NEUTRAL;
  if(o.view==='front')drawHeadFront(C,ex);
  else if(o.view==='tq')drawHead34(C,ex);
  else drawHeadProfile(C,ex);
  ctx.restore();
}

// ---- eyes: folk fish-almond, lids as tapered ribbons ----
function drawEyeFront(x,y,flip,C,ex){
  ctx.save();ctx.translate(x,y);if(flip)ctx.scale(-1,1);
  const op=ex.open, lr=ex.lowRaise||0;  // op scales lid height, lr raises lower lid (smile squint)
  const topA=-0.088*op, topB=-0.100*op;
  // almond white
  ctx.beginPath();
  ctx.moveTo(-0.175,-0.010);
  ctx.quadraticCurveTo(-0.02,topA,0.135,0.010);
  ctx.quadraticCurveTo(0.175,0.028,0.135,0.045-lr*0.6);
  ctx.quadraticCurveTo(-0.02,0.070-lr,-0.175,-0.010);
  ctx.closePath();ctx.fillStyle='#f4e9d6';ctx.fill();
  // iris (≈42% eye width), tucked slightly under upper lid, gaze forward
  ctx.save();ctx.clip();
  const iy=-0.008+ (1-op)*0.02;
  dot(ex.gaze*0.05-0.010,iy,0.074,C.iris);
  dot(ex.gaze*0.05-0.010,iy,0.056,C.irisMid);
  dot(ex.gaze*0.05-0.010,iy,0.034,KOHL);
  dot(ex.gaze*0.05-0.032,iy-0.024,0.017,'rgba(255,241,220,0.92)'); // small warm highlight
  ctx.fillStyle='rgba(20,10,4,0.22)';ctx.fillRect(-0.20,-0.09,0.4,0.05); // kohl shade under lid
  ctx.restore();
  // kohl upper lid — tapered ribbon, heavy over iris
  ink([
    {x:-0.178,y:-0.006,w:0.006},
    {x:-0.075,y:topB*0.62-0.006,w:0.032},
    {x:0.02,y:topB*0.58-0.004,w:0.026},
    {x:0.112,y:0.002,w:0.013},
    {x:0.136,y:0.014,w:0.006},
  ],KOHL);
  // outward surma wing
  ink([{x:-0.158,y:-0.012,w:0.020},{x:-0.238,y:-0.046,w:0.012},{x:-0.312,y:-0.03,w:0.002}],KOHL);
  // lower lid thin ribbon
  ink([{x:-0.148,y:0.010,w:0.004},{x:-0.02,y:0.064-lr,w:0.011},{x:0.115,y:0.040-lr*0.6,w:0.005}],KOHL);
  ctx.restore();
}

function drawBrowFront(x,y,flip,C,ex){
  ctx.save();ctx.translate(x,y+(ex.browY||0));if(flip)ctx.scale(-1,1);
  const heavy=!C.female;
  const w0=heavy?0.028:0.018;
  const innerY=heavy?-0.004:0.004, peakY=heavy?-0.086:-0.078;
  const m=ex.browMood||0; // >0 raise inner (grief), <0 lower inner (resolve/anger)
  ink([
    {x:0.155,y:innerY-m*0.05,w:w0*0.9},              // inner
    {x:0.02,y:peakY+m*0.03,w:w0},
    {x:-0.145,y:-0.034,w:w0*0.72},
    {x:-0.255,y:0.028,w:w0*0.28},                    // outer taper
  ],KOHL);
  ctx.restore();
}

function drawNoseFront(C){
  // subtle: soft side ridge + tip + nostrils (bridge built by cel shadow)
  ink([{x:0.028,y:0.05,w:0.006},{x:0.05,y:0.16,w:0.010},{x:0.03,y:0.255,w:0.012},{x:-0.006,y:0.295,w:0.010}],'rgba(60,30,12,0.62)');
  ink([{x:-0.006,y:0.292,w:0.008},{x:-0.05,y:0.278,w:0.005}],'rgba(60,30,12,0.5)');
  ctx.fillStyle='rgba(45,22,8,0.5)';
  ctx.beginPath();ctx.ellipse(-0.05,0.285,0.016,0.011,0.3,0,TAU);ctx.fill();
  ctx.beginPath();ctx.ellipse(0.056,0.285,0.016,0.011,-0.3,0,TAU);ctx.fill();
  if(C.female){dot(-0.078,0.276,0.017,GOLD);dot(-0.078,0.276,0.007,GOLD_L);}
}

function drawMouthFront(C,ex){
  const y=0.46, who=C.who;
  const w=who==='arjuna'?0.088:0.098;
  const t=ex.mouth||0; // -1 grief(down) .. 0 neutral .. 1 joy(up)
  ctx.save();ctx.translate(0,y);
  ctx.fillStyle=who==='arjuna'?'#7c2c22':LIP;
  const cx=t*0.050; // corner lift/drop
  ctx.beginPath();
  ctx.moveTo(-w,0.0-cx);
  ctx.quadraticCurveTo(-w*0.5,-0.030-cx*0.3,0,-0.006);
  ctx.quadraticCurveTo(w*0.5,-0.030-cx*0.3,w,0.0-cx);
  ctx.quadraticCurveTo(w*0.5,0.052+cx*0.4,0,0.056+ (t<0?0.014:0));
  ctx.quadraticCurveTo(-w*0.5,0.052+cx*0.4,-w,0.0-cx);
  ctx.closePath();ctx.fill();
  // parting line as tapered ribbon (heaviest interior mark), curves with expr
  ink([{x:-w*0.96,y:0.004-cx,w:0.005},{x:-w*0.4,y:0.012-cx*0.5,w:0.012},{x:0,y:0.018-cx*0.2,w:0.013},{x:w*0.4,y:0.012-cx*0.5,w:0.012},{x:w*0.96,y:0.004-cx,w:0.005}],INK2);
  ctx.fillStyle='rgba(255,214,196,0.20)';
  ctx.beginPath();ctx.moveTo(-w*0.6,0.030);ctx.quadraticCurveTo(0,0.05,w*0.6,0.030);ctx.quadraticCurveTo(0,0.040,-w*0.6,0.030);ctx.fill();
  ctx.restore();
}

function drawMustacheFront(){
  ctx.save();ctx.translate(0,0.415);ctx.fillStyle='#241305';
  for(const s of [-1,1]){ctx.beginPath();
    ctx.moveTo(s*0.006,0.006);
    ctx.quadraticCurveTo(s*0.06,0.030,s*0.118,0.020);
    ctx.quadraticCurveTo(s*0.145,0.010,s*0.130,-0.014);
    ctx.quadraticCurveTo(s*0.10,0.005,s*0.06,0.004);
    ctx.quadraticCurveTo(s*0.03,0.0,s*0.006,0.006);
    ctx.closePath();ctx.fill();}
  ctx.restore();
}
function drawForeheadOrnament(C){
  if(C.female){dot(0,-0.24,0.028,'#c92f1d');dot(0,-0.24,0.012,GOLD_L);}
  else{ctx.fillStyle='rgba(232,182,76,0.92)';ctx.beginPath();ctx.moveTo(-0.022,-0.34);ctx.lineTo(0.022,-0.34);ctx.lineTo(0.012,-0.14);ctx.lineTo(-0.012,-0.14);ctx.closePath();ctx.fill();
    ctx.fillStyle='#b23016';ctx.beginPath();ctx.moveTo(-0.008,-0.30);ctx.lineTo(0.008,-0.30);ctx.lineTo(0.006,-0.16);ctx.lineTo(-0.006,-0.16);ctx.closePath();ctx.fill();}
}

// ---- FRONT ----
function faceOvalFront(){ctx.beginPath();
  ctx.moveTo(0,-0.60);
  ctx.quadraticCurveTo(0.40,-0.58,0.44,-0.20);
  ctx.quadraticCurveTo(0.46,0.10,0.36,0.34);
  ctx.quadraticCurveTo(0.28,0.56,0.14,0.66);
  ctx.quadraticCurveTo(0.06,0.72,0,0.72);
  ctx.quadraticCurveTo(-0.06,0.72,-0.14,0.66);
  ctx.quadraticCurveTo(-0.28,0.56,-0.36,0.34);
  ctx.quadraticCurveTo(-0.46,0.10,-0.44,-0.20);
  ctx.quadraticCurveTo(-0.40,-0.58,0,-0.60);
  ctx.closePath();
}
function drawHeadFront(C,ex){
  const skin=C.skin,shade=C.shade;
  // back hair mass
  ctx.fillStyle=KOHL;ctx.beginPath();
  ctx.moveTo(-0.52,-0.30);ctx.quadraticCurveTo(-0.60,-0.86,0,-0.94);ctx.quadraticCurveTo(0.60,-0.86,0.52,-0.30);
  ctx.quadraticCurveTo(0.66,0.10,0.50,0.55);ctx.lineTo(0.30,0.55);ctx.quadraticCurveTo(0.46,0.0,0.40,-0.30);
  ctx.lineTo(-0.40,-0.30);ctx.quadraticCurveTo(-0.46,0.0,-0.30,0.55);ctx.lineTo(-0.50,0.55);
  ctx.quadraticCurveTo(-0.66,0.10,-0.52,-0.30);ctx.closePath();ctx.fill();
  // neck
  ctx.fillStyle=skin;ctx.beginPath();ctx.moveTo(-0.15,0.66);ctx.lineTo(-0.17,0.98);ctx.lineTo(0.17,0.98);ctx.lineTo(0.15,0.66);ctx.closePath();ctx.fill();
  // neck hard cel shadow (right + under-jaw cast)
  ctx.fillStyle=shade;ctx.beginPath();ctx.moveTo(0.15,0.66);ctx.lineTo(0.17,0.98);ctx.lineTo(-0.02,0.98);ctx.quadraticCurveTo(0.03,0.80,0.10,0.68);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(-0.13,0.68);ctx.quadraticCurveTo(0,0.78,0.13,0.68);ctx.lineTo(0.12,0.74);ctx.quadraticCurveTo(0,0.84,-0.12,0.74);ctx.closePath();ctx.fill();

  // face fill
  faceOvalFront();ctx.fillStyle=skin;ctx.fill();
  // ---- ONE hard cel shadow, hugging far (right) third ----
  ctx.save();faceOvalFront();ctx.clip();ctx.fillStyle=shade;
  // A) nose-side sliver (builds nose)

function drawEyeProfile(x,y,C,ex){
  ctx.save();ctx.translate(x,y);const op=ex.open, lr=ex.lowRaise||0;

  ctx.moveTo(-0.152,0.008);
  ctx.quadraticCurveTo(-0.04,-0.066*op,0.10,-0.008);
  ctx.quadraticCurveTo(0.176,0.016,0.150,0.032-lr*0.5);
  ctx.quadraticCurveTo(-0.03,0.048-lr,-0.152,0.008);
  ctx.closePath();ctx.fillStyle='#f7eedd';ctx.fill();
  ctx.save();ctx.clip();
  const ix=-0.072+(ex.gaze||0)*0.03, iy=-0.004+(1-op)*0.02; // iris rides the FRONT third; sclera clean behind
  dot(ix,iy,0.058,C.iris);dot(ix,iy,0.044,C.irisMid);dot(ix,iy,0.027,KOHL);

  ctx.fillStyle='rgba(20,10,4,0.16)';ctx.fillRect(-0.16,-0.075,0.36,0.036);ctx.restore();
  // kohl upper lid flowing into the long surma tail — droops, then lifts, dies to nothing
  ink([{x:-0.152,y:0.008,w:0.006},{x:-0.052,y:-0.054*op,w:0.024},{x:0.06,y:-0.026*op,w:0.017},{x:0.148,y:0.014,w:0.009}],KOHL);
  ink([{x:0.132,y:0.006,w:0.009},{x:0.208,y:-0.020,w:0.005},{x:0.264,y:-0.018,w:0.003},{x:0.296,y:-0.032,w:0.001}],KOHL);

  ctx.restore();
}

function drawNicheFrame(cx,topY,w,hgt,label){
  ctx.save();archPath(cx,topY,w,hgt);ctx.strokeStyle=GOLD;ctx.lineWidth=4;ctx.stroke();
  archPath(cx,topY-5,w+10,hgt+5);ctx.strokeStyle=INDIGO;ctx.lineWidth=2;ctx.stroke();

  ctx.restore();
}

function drawHand(x,y,r,rot,pose,C){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=C.skin;
  if(pose==='grip'){ // closed fist around a shaft (bow)
    blob([{x:-r*0.55,y:-r*0.7},{x:r*0.5,y:-r*0.8},{x:r*0.75,y:0},{x:r*0.5,y:r*0.85},{x:-r*0.55,y:r*0.7},{x:-r*0.7,y:0}],C.skin);
    // knuckle cut lines
    ink([{x:-r*0.2,y:-r*0.55,w:r*0.06},{x:-r*0.2,y:r*0.55,w:r*0.06}],'rgba(90,50,20,0.5)');
    ink([{x:r*0.18,y:-r*0.5,w:r*0.05},{x:r*0.18,y:r*0.5,w:r*0.05}],'rgba(90,50,20,0.4)');
    // thumb over
    blob([{x:-r*0.1,y:r*0.2},{x:r*0.4,y:r*0.35},{x:r*0.55,y:r*0.7},{x:r*0.2,y:r*0.75},{x:-r*0.1,y:r*0.55}],C.skin);
  } else if(pose==='draw'){ // fingers pinching string near face
    blob([{x:-r*0.5,y:-r*0.5},{x:r*0.5,y:-r*0.55},{x:r*0.7,y:r*0.1},{x:r*0.35,y:r*0.75},{x:-r*0.4,y:r*0.6},{x:-r*0.65,y:0}],C.skin);
    ink([{x:r*0.15,y:-r*0.5,w:r*0.05},{x:r*0.35,y:r*0.5,w:r*0.05}],'rgba(90,50,20,0.45)');
    ink([{x:-r*0.15,y:-r*0.5,w:r*0.05},{x:-r*0.02,y:r*0.55,w:r*0.05}],'rgba(90,50,20,0.4)');
    blob([{x:-r*0.5,y:-r*0.1},{x:-r*0.1,y:-r*0.5},{x:0,y:-r*0.9},{x:-r*0.35,y:-r*0.7},{x:-r*0.6,y:-r*0.3}],C.skin); // thumb up
  } else if(pose==='lotus'){ // open graceful hand, fingers gently splayed upward
    blob([{x:-r*0.5,y:r*0.5},{x:-r*0.55,y:-r*0.2},{x:-r*0.2,y:-r*0.6},{x:r*0.25,y:-r*0.55},{x:r*0.6,y:-r*0.1},{x:r*0.55,y:r*0.55}],C.skin);
    // finger cut lines (2) fanning up
    ink([{x:-r*0.18,y:r*0.5,w:r*0.05},{x:-r*0.28,y:-r*0.5,w:r*0.04}],'rgba(90,50,20,0.45)');
    ink([{x:r*0.16,y:r*0.5,w:r*0.05},{x:r*0.28,y:-r*0.45,w:r*0.04}],'rgba(90,50,20,0.4)');
    // thumb to side
    blob([{x:-r*0.5,y:r*0.15},{x:-r*0.85,y:r*0.1},{x:-r*0.9,y:r*0.45},{x:-r*0.55,y:r*0.5}],C.skin);
  } else { // rest — relaxed hand at hip/side, fingers together curving down

  ctx.fillStyle=SK;ctx.beginPath();ctx.moveTo(shoX-0.28,-2.10);ctx.quadraticCurveTo(shoX,-2.22,shoX+0.28,-2.10);ctx.quadraticCurveTo(shoX+0.22,-2.30,shoX+0.10,-2.40);ctx.lineTo(shoX-0.10,-2.40);ctx.quadraticCurveTo(shoX-0.22,-2.30,shoX-0.28,-2.10);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(shoX-0.09,-2.34);ctx.lineTo(shoX-0.10,-2.52);ctx.lineTo(shoX+0.10,-2.52);ctx.lineTo(shoX+0.09,-2.34);ctx.closePath();ctx.fill();

  ctx.fillStyle=SK;ctx.beginPath();ctx.moveTo(shoX+0.24,-2.22);ctx.quadraticCurveTo(0.50,-2.32,0.52,-2.56);ctx.quadraticCurveTo(0.52,-2.74,0.44,-2.80);ctx.lineTo(0.34,-2.72);ctx.quadraticCurveTo(0.40,-2.60,0.38,-2.48);ctx.quadraticCurveTo(0.36,-2.36,shoX+0.22,-2.26);ctx.closePath();ctx.fill();

  ctx.fillStyle=CRIM;const lw=w*0.72,lh=30,ly=topY+hgt+5,lx=cx-lw/2;roundRect(lx,ly,lw,lh,7);ctx.fill();ctx.strokeStyle=GOLD;ctx.lineWidth=2;roundRect(lx,ly,lw,lh,7);ctx.stroke();

// ---------- expression strip ----------
function drawExprStrip(){

  ctx.fillStyle='rgba(42,59,107,0.14)';roundRect(70,y0-6,W-140,stripH,10);ctx.fill();
  const who=['draupadi','draupadi','draupadi','draupadi','arjuna','arjuna','arjuna','arjuna'];
  const moods=['serene','joy','grief','resolve','serene','joy','grief','resolve'];
  const labels=['serene','joy','grief','resolve','serene','joy','grief','resolve'];
  const n=8, pad=110, span=(W-2*pad)/ (n);
  for(let i=0;i<n;i++){
    const cx=pad+span*(i+0.5);
    const cy=y0+56;
    ctx.save();
    // small niche disc
    dot(cx,cy+2,67,'rgba(255,245,220,0.55)');ring(cx,cy+2,67,2,'rgba(165,116,31,0.42)');

  ctx.textAlign='right';ctx.fillText('serene · joy · grief · resolve',W-94,y0+6);
}

// COMPOSE
// =====================================================================
function compose(){
  drawBackground();drawFrame();

  // ---- TOP ROW: six portrait niches ----
  const centers=[214,512,810,1108,1406,1704];
  const specs=[
    {who:'draupadi',view:'front',label:'Draupadī · front'},
    {who:'draupadi',view:'tq',label:'Draupadī · ¾'},
    {who:'draupadi',view:'profile',label:'Draupadī · profile'},
    {who:'arjuna',view:'front',label:'Arjuna · front'},
    {who:'arjuna',view:'tq',label:'Arjuna · ¾'},
    {who:'arjuna',view:'profile',label:'Arjuna · profile'},
  ];
  const nTop=44,nW=280,nH=452;
  specs.forEach((s,i)=>drawNiche(centers[i],nTop,nW,nH,s.view));
  specs.forEach((s,i)=>{
    const S=175;const cy=nTop+nH*0.45;
    ctx.save();archPath(centers[i],nTop-3,nW-6,nH-3);ctx.clip();
    drawHead({cx:centers[i],cy,S,view:s.view,who:s.who});
    ctx.restore();
  });
  specs.forEach((s,i)=>drawNicheFrame(centers[i],nTop,nW,nH,s.label));

  // ---- MIDDLE ROW: figures + kalasha + title ----
  const fTop=552,fW=440,fH=322;
  const dX=372,aX=W-372;
  drawFigNiche(dX,fTop,fW,fH);drawFigNiche(aX,fTop,fW,fH);
  ctx.save();archPath(dX,fTop-3,fW-6,fH-2);ctx.clip();drawDraupadiFull(dX,fTop+fH-14,88);ctx.restore();
  ctx.save();archPath(aX,fTop-3,fW-6,fH-2);ctx.clip();drawArjunaFull(aX,fTop+fH-14,88);ctx.restore();
  drawFigNicheFrame(dX,fTop,fW,fH,'Draupadī · tribhaṅga');
  drawFigNicheFrame(aX,fTop,fW,fH,'Arjuna · archer');
  drawKalasha(W/2,fTop+fH-16,72);
  drawTitle();

  // ---- BOTTOM STRIP: expressions ----
  drawExprStrip();

  window.__done=true;
}
// ---- expression QA harness (only when #expr): 4 views x 4 moods ----
function composeExprTest(){
  drawBackground();
  const views=[['dra_tq','draupadi','tq'],['dra_profile','draupadi','profile'],['arj_tq','arjuna','tq'],['arj_profile','arjuna','profile']];
  const moods=['serene','joy','grief','resolve'];
  const cols=moods.length, rows=views.length;
  const cw=W/cols, ch=H/rows;
  ctx.fillStyle=INK;ctx.font='600 20px Georgia, serif';ctx.textAlign='center';ctx.textBaseline='top';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const cx=cw*(c+0.5), cy=ch*r+ch*0.56;
    drawHead({cx,cy,S:112,view:views[r][2],who:views[r][1],expr:EXPR[moods[c]]});
    ctx.fillStyle='#6b1119';ctx.fillText(views[r][0].replace('_',' · ')+'  ·  '+moods[c],cx,ch*r+8);
  }
  window.__done=true;
}

  {const cx=W/2,y=64;ctx.save();ctx.fillStyle=INDIGO_D;roundRect(cx-372,y-18,744,36,9);ctx.fill();

    ctx.fillStyle=GOLD_L;ctx.font='700 20px Georgia, serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(R.name,0,1);ctx.restore();
