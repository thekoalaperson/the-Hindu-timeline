<!doctype html>
<meta charset="utf-8">
<style>body{margin:0;background:#20160e}canvas{display:block}</style>
<canvas id="cv" width="1920" height="1080"></canvas>
<script src="../src/core.js"></script>
<script src="../src/paint.js"></script>
<script src="../src/acting.js"></script>
<script src="../src/wardrobe.js"></script>
<script src="../src/person.js"></script>
<script src="../src/archetypes.js"></script>
<script src="../src/person3.js"></script>
<script>
'use strict';
const ctx = document.getElementById('cv').getContext('2d');
const T = parseFloat(new URLSearchParams(location.search).get('t') || '1.0');
vgrad(ctx, 0, 0, W, H, [[0, '#e9d9b6'], [1, '#c8b184']]);
const rak = { skin: '#6e4a3a', skinShade: '#3c2418', hairColor: '#140d06', hairstyle: 'mane',
  tusks: true, mane: true, heavyBrow: true, claws: true, iris: '#7a1e12', lip: '#57271f' };
const turns = [0.05, 0.35, 0.6, 0.9];
turns.forEach((tn, i) => {
  ctx.save(); ctx.translate(300 + i * 420, 320);
  drawHead3(ctx, 150, rak, { turn: tn, brow: 0.7, eyeOpen: 1.1, lipsPart: 0.5, rage: 1 }, T + i, i * 7 + 1);
  ctx.restore();
  ctx.fillStyle = '#3a2410'; ctx.font = '20px Georgia'; ctx.textAlign = 'center';
  ctx.fillText('rage t' + tn, 300 + i * 420, 560);
});
// a full rakshasa figure with claw hands
drawFigure(ctx, { x: 500, y: 1040, s: 1.1, facing: -1, style: Object.assign({ garb: 'hide', clothMain: '#4a3020', clothAccent: '#8c2f1d', build: 1.4, shoulderScale: 1.4, moustache: 2 }, rak),
  pose: { lean: 0.28, headNod: 0.2, headTurn: 0.3, armF: { sh: 1.3, el: 0.9, wr: 0.28, hand: 'claw' }, armB: { sh: 1.1, el: 1.0, wr: -0.28, hand: 'claw' }, legF: { hip: 0.4, knee: 0.3 }, legB: { hip: -0.5, knee: 0.45 }, face: { brow: 0.7, eyeOpen: 1.1, lipsPart: 0.6, rage: 1 } }, t: T, seed: 41 });
ctx.fillText('rakshasa figure (claws/hide/mane)', 500, 1064);
</script>
