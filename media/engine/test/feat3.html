<!doctype html>
<meta charset="utf-8">
<style>body{margin:0;background:#20160e}canvas{display:block}</style>
<canvas id="cv" width="1920" height="1080"></canvas>
<script src="../src/core.js"></script>
<script src="../src/paint.js"></script>
<script src="../src/acting.js"></script>
<script src="../src/wardrobe.js"></script>
<script src="../src/person.js"></script>
<script src="../src/archetypes.js"></script>
<script src="../src/person3.js"></script>
<script>
'use strict';
const ctx = document.getElementById('cv').getContext('2d');
const q = new URLSearchParams(location.search);
const T = parseFloat(q.get('t') || '1.0');
vgrad(ctx, 0, 0, W, H, [[0, '#e9d9b6'], [0.6, '#dcc9a0'], [1, '#c8b184']]);
function lbl(txt, x, y) { ctx.fillStyle = '#3a2410'; ctx.font = '20px Georgia'; ctx.textAlign = 'center'; ctx.fillText(txt, x, y); }

// Bakāsura — the rakshasa (fangs, claws, wild mane, heavy brow), fight pose
const baka = Object.assign({}, Person.of('bakasura').style, { build: 1.4, shoulderScale: 1.4, hairstyle: 'mane' });
drawFigure(ctx, { x: 230, y: 980, s: 0.8, facing: -1, style: baka, pose: {
  lean: 0.28, headNod: 0.2, headTurn: 0.3,
  armF: { sh: 1.3, el: 0.9, wr: 0.28, hand: 'claw' }, armB: { sh: 1.1, el: 1.0, wr: -0.28, hand: 'claw' },
  legF: { hip: 0.4, knee: 0.3 }, legB: { hip: -0.5, knee: 0.45 },
  face: { brow: 0.7, eyeOpen: 1.1, lipsPart: 0.6, rage: 1 },
}, t: T, seed: 41 });
lbl('bakasura (rakshasa: fangs/claws/mane)', 230, 1030);

// Dharma — deity via CLASS path (halo behind head)
Person.of({ archetype: 'deity', skin: '#cbae72', hairColor: '#efe8d6', hairstyle: 'sagebun',
  beard: 'white', garb: 'robe', clothMain: '#e8c25a', clothAccent: '#a1651c', crown: null,
  halo: true, haloColor: '#ffe9a8', scarf: '#d8b25a', mala: true, tilak: 'urdhva' })
  .draw(ctx, { x: 560, y: 980, s: 0.8, facing: -1, pose: 'bless', t: T, seed: 41 });
lbl('deity (halo + scarf, class)', 560, 1030);

// Karna — armor cuirass + turban
drawFigure(ctx, { x: 850, y: 980, s: 0.8, facing: -1, style: {
  skin: '#d9a05e', skinShade: '#9a6426', hairColor: '#1d1207', hairstyle: 'topknot',
  garb: 'armor', clothMain: '#caa54a', clothAccent: '#8c5a12', earring: true,
  crown: 'turban', turbanColor: '#8c2f1d', ornaments: 1, armlets: true, build: 1.06 },
  pose: POSES.stand(1, T, 5), t: T, seed: 5 });
lbl('karna (armor)', 850, 1030);

// Krishna — scarf (uttariya) + peacock + yellow
drawFigure(ctx, { x: 1120, y: 980, s: 0.8, facing: -1, style: Person.of('bakasura') ? {
  skin: '#5c7ba1', skinShade: '#33507a', hairColor: '#12100c', hairstyle: 'topknot',
  garb: 'dhoti', clothMain: '#e8bd35', clothAccent: '#a1651c', peacock: true, earring: true,
  ornaments: 2, armlets: true, scarf: '#f2d066', tilak: 'urdhva', lip: '#7c3450', dhotiLen: 210 } : {},
  pose: POSES.stand(1, T, 7), t: T, seed: 7 });
lbl('krishna (scarf)', 1120, 1030);

// Veiled woman — braid + veil color (torso-drape veil)
drawFigure(ctx, { x: 1360, y: 980, s: 0.8, facing: -1, style: {
  female: true, skin: '#c08a5c', skinShade: '#875428', hairColor: '#241a10', hairstyle: 'braid',
  garb: 'sari', clothMain: '#9a563a', clothAccent: '#d9b06a', veil: '#a86a44', bindi: true,
  earring: true, ornaments: 1, lip: '#96442f', build: 0.9 },
  pose: POSES.grief(0.8, T, 3), t: T, seed: 3 });
lbl('brahminWife (veil drape + grief/tears)', 1360, 1030);

// Multi-arm deity (arms>=4)
Person.of({ archetype: 'deity', skin: '#e8c25a', hairColor: '#140d06', hairstyle: 'topknot',
  garb: 'sari', female: true, clothMain: '#a11e2c', clothAccent: '#e8b64c', crown: 'mukut',
  ornaments: 3, arms: 4, halo: true })
  .draw(ctx, { x: 1650, y: 980, s: 0.8, facing: -1, pose: { armF: { sh: 1.0, el: 1.3, hand: 'bless' }, armB: { sh: 0.2, el: 0.3 }, armF2: { sh: 1.5, el: 0.4, hand: 'open' }, armB2: { sh: -0.7, el: 0.5, hand: 'open' } }, t: T, seed: 9 });
lbl('multi-arm deity (arms:4 + halo)', 1650, 1030);
</script>
